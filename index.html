<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1f1e24">
  <title>EVA MARS EXPLORER</title>
  <link rel="icon" type="image/png" sizes="64x64" href="./data/Icon/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@600;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="./geospatial/i18n.js"></script>
  <script src="./geospatial/theme.js"></script>
  <link rel="stylesheet" href="./geospatial/martian_theme.css">
  <style>
    :root {
      font-family: 'Space Grotesk', Inter, sans-serif;
      background: var(--bg-canvas);
      color: var(--text-primary);
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      position: relative;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(var(--accent-rgb), 0.12), transparent 55%),
        var(--bg-canvas);
    }
    .eva-lang-switch {
      position: fixed;
      top: 16px;
      right: 20px;
      z-index: 40;
      display: inline-flex;
      align-items: center;
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      border-radius: 3px;
      padding: 2px;
      gap: 2px;
      box-shadow: var(--panel-shadow);
    }
    .eva-lang-btn {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.06em;
      padding: 4px 9px;
      border-radius: 3px;
      border: 1px solid transparent;
      color: var(--text-secondary);
      background: transparent;
      cursor: pointer;
      transition: all 0.16s ease;
      line-height: 1.1;
    }
    .eva-lang-btn:hover {
      color: var(--text-primary);
      background: var(--bg-hover);
    }
    .eva-lang-btn.active {
      color: var(--accent-contrast-text);
      background: var(--accent-primary);
      border-color: var(--accent-primary);
      box-shadow: 0 0 10px var(--accent-glow);
    }
    main { width: min(760px, 100%); }
    header { margin-bottom: 32px; text-align: center; }
    .eyebrow {
      color: var(--accent-primary);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    h1 { margin: 20px 0 16px; }
    .brand-eva {
      display: block;
      font-family: 'Space Grotesk', 'Inter', sans-serif;
      font-size: clamp(4.5rem, 16vw, 7.5rem);
      font-weight: 900;
      letter-spacing: 0.05em;
      line-height: 0.9;
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      filter: drop-shadow(0 8px 0 rgba(66, 25, 17, 0.75))
        drop-shadow(0 15px 18px rgba(193, 107, 81, 0.32));
    }
    .brand-name {
      display: block;
      font-family: 'Space Grotesk', 'Inter', sans-serif;
      margin-top: 14px;
      color: var(--text-primary);
      font-size: clamp(1.1rem, 4vw, 1.8rem);
      font-weight: 800;
      letter-spacing: 0.28em;
    }
    header p { margin: 0; color: var(--text-secondary); }
    nav { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
    nav a {
      min-height: 190px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
      border: 1px solid var(--border-subtle);
      border-radius: 3px;
      background: var(--bg-panel);
      color: inherit;
      text-decoration: none;
      transition: border-color 160ms ease, transform 160ms ease, background 160ms ease;
    }
    nav a:hover, nav a:focus-visible {
      transform: translateY(-3px);
      border-color: var(--accent-primary);
      background: var(--bg-hover);
      outline: none;
    }
    .icon { color: var(--accent-primary); font-size: 1.8rem; }
    h2 { margin: 20px 0 8px; font-size: 1.25rem; }
    nav p { margin: 0; color: var(--text-secondary); line-height: 1.5; }
    .open { margin-top: 20px; color: var(--accent-primary); font-weight: 700; }
  </style>
</head>
<body>
  <div id="langToggleGroupHome" class="eva-lang-switch" role="group" aria-label="Language Selector">
    <button id="btnLangEngHome" type="button" class="eva-lang-btn active" onclick="window.setEvaLang && window.setEvaLang('en')" title="Switch to English">ENG</button>
    <button id="btnLangVieHome" type="button" class="eva-lang-btn" onclick="window.setEvaLang && window.setEvaLang('vi')" title="Chuyển sang Tiếng Việt">VIE</button>
  </div>
  <main>
    <header>
      <div id="homeEyebrow" class="eyebrow">Mission Control</div>
      <h1><span class="brand-eva eva-wordmark">EVA</span><span class="brand-name">MARS EXPLORER</span></h1>
      <p id="homeSubtitle">Choose an explorer to begin your mission.</p>
    </header>
    <nav aria-label="Choose a Mars map">
      <a href="mars_2d_map.html">
        <div>
          <div class="icon" aria-hidden="true">▦</div>
          <h2 id="homeCard2DTitle">2D Mars Map</h2>
          <p id="homeCard2DDesc">Explore Mars surface layers and plan routes on a flat map.</p>
        </div>
        <span id="homeCard2DOpen" class="open">Open 2D map &rarr;</span>
      </a>
      <a href="mars_3d_map.html">
        <div>
          <div class="icon" aria-hidden="true">◎</div>
          <h2 id="homeCard3DTitle">3D Globe Explorer</h2>
          <p id="homeCard3DDesc">Explore the Martian terrain and mission data on a 3D globe.</p>
        </div>
        <span id="homeCard3DOpen" class="open">Open 3D explorer &rarr;</span>
      </a>
    </nav>
  </main>
  <script>
    function applyHomeLocalization() {
      const lang = typeof window.getEvaLang === 'function' ? window.getEvaLang() : 'en';
      const isVi = lang === 'vi';
      const tr = (en, vi) => (isVi ? vi : en);
      const btnEng = document.getElementById('btnLangEngHome');
      const btnVie = document.getElementById('btnLangVieHome');
      if (btnEng) btnEng.classList.toggle('active', !isVi);
      if (btnVie) btnVie.classList.toggle('active', isVi);

      document.getElementById('homeEyebrow').textContent = tr('Mission Control', 'Trung Tâm Điều Khiển Nhiệm Vụ');
      document.getElementById('homeSubtitle').textContent = tr('Choose an explorer to begin your mission.', 'Chọn chế độ khám phá để bắt đầu nhiệm vụ của bạn.');
      document.getElementById('homeCard2DTitle').textContent = tr('2D Mars Map', 'Bản Đồ Sao Hỏa 2D');
      document.getElementById('homeCard2DDesc').textContent = tr('Explore Mars surface layers and plan routes on a flat map.', 'Khám phá các lớp bề mặt Sao Hỏa và hoạch định tuyến đường trên bản đồ phẳng.');
      document.getElementById('homeCard2DOpen').innerHTML = tr('Open 2D map &rarr;', 'Mở bản đồ 2D &rarr;');
      document.getElementById('homeCard3DTitle').textContent = tr('3D Globe Explorer', 'Quả Địa Cầu 3D');
      document.getElementById('homeCard3DDesc').textContent = tr('Explore the Martian terrain and mission data on a 3D globe.', 'Khám phá địa hình Sao Hỏa và dữ liệu nhiệm vụ trên quả địa cầu 3D.');
      document.getElementById('homeCard3DOpen').innerHTML = tr('Open 3D explorer &rarr;', 'Mở quả địa cầu 3D &rarr;');
    }
    if (typeof window.onEvaLangChange === 'function') {
      window.onEvaLangChange(applyHomeLocalization);
    }
    applyHomeLocalization();

    const AudioContextConstructor = window.AudioContext || window.webkitAudioContext;
    let audioContext;

    function playTone(type) {
      const now = audioContext.currentTime;
      const duration = type === "hover" ? 0.07 : 0.12;
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();

      oscillator.type = "sine";
      oscillator.frequency.setValueAtTime(type === "hover" ? 680 : 420, now);
      oscillator.frequency.exponentialRampToValueAtTime(type === "hover" ? 980 : 760, now + duration);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.linearRampToValueAtTime(type === "hover" ? 0.025 : 0.045, now + 0.01);
      gain.gain.exponentialRampToValueAtTime(type === "hover" ? 0.0001, now + duration);

      oscillator.connect(gain);
      gain.connect(audioContext.destination);
      oscillator.start(now);
      oscillator.stop(now + duration);
    }

    function playMenuSound(type) {
      if (!AudioContextConstructor) return;
      if (!audioContext) audioContext = new AudioContextConstructor();

      if (audioContext.state === "suspended") {
        audioContext.resume().then(() => {
          if (audioContext.state === "running") playTone(type);
        }).catch((error) => {
          if (error.name !== "NotAllowedError") {
            console.error("Could not start menu sound.", error);
          }
        });
        return;
      }

      if (audioContext.state === "running") playTone(type);
    }

    document.querySelectorAll("nav a").forEach((link) => {
      link.addEventListener("pointerenter", (event) => {
        if (event.pointerType !== "touch") playMenuSound("hover");
      });

      link.addEventListener("click", (event) => {
        playMenuSound("click");

        const isRegularNavigation = event.button === 0
          && !event.ctrlKey
          && !event.metaKey
          && !event.shiftKey
          && !event.altKey
          && (!link.target || link.target === "_self")
          && !link.hasAttribute("download");

        if (!isRegularNavigation) return;
        event.preventDefault();
        window.setTimeout(() => window.location.assign(link.href), 130);
      });
    });
  </script>
</body>
</html>
